[package]
name = "zix-native-provider"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/cli"
description = "Reviewed read-only provider profiles over the bounded zix native protocol"
publish = false
[dependencies]
zix-cli = { path = "../.." }
zix-operation-contracts = { path = "../operation-contracts" }
crowsi-provider-read-http = { git = "https://github.com/crowsi-net/crowsi-transport-foundation", rev = "8daf36688e1618f294274c61ebfe607f77639534" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zeroize = "1.8"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
