[package]
name = "zix-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/cli"
description = "Reviewed API catalogs and integrity-bound local provider commands"
publish = false

[[bin]]
name = "zix"
path = "src/main.rs"

[[bin]]
name = "zix-contract-probe"
path = "tests/support/provider.rs"

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
zix-operation-contracts = { path = "crates/operation-contracts" }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
url = "2.5"
zixcel-bounded-io = { git = "https://github.com/zixcel/zixcel-contracts", rev = "24a7ec9e328987d931cf49dd97ca23a6ae50db2f" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs", "process", "termios"] }
crowsi-process-adapter = "=0.10.0"
zeroize = "1.9.1"
tokio = { version = "1.49", features = ["rt", "macros", "io-util", "time", "signal"] }

[features]
default = []
credential-store = ["dep:crowsi-credential-broker"]

[target.'cfg(target_os = "linux")'.dependencies]
crowsi-credential-broker = { version = "=0.1.2", default-features = false, features = ["linux-secret-service"], optional = true }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[bin]]
name = "zix-package"
path = "tools/native-release/main.rs"

[profile.release]
strip = "debuginfo"
