name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux custody dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsecret-1-dev gnome-keyring dbus-x11
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: python3 tests/credential_os.py target/debug/zix target/debug/zix-contract-probe
      - run: cargo test --locked --workspace --all-targets --no-default-features
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
